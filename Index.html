<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقييم الرحلة – رحلات التميّز | TM</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: #7a6030;
    --white: #f5f0e8;
    --gray: #2a2a2a;
    --border: #2e2e2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 60px;
    position: relative;
    z-index: 1;
  }

  /* === HERO === */
  .hero {
    text-align: center;
    padding: 40px 0 30px;
  }

  .logo-ring {
    width: 90px;
    height: 90px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 2px solid var(--gold-dim);
    padding: 3px;
    position: relative;
  }
  .logo-ring::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.2);
  }
  .logo-ring img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }

  .hero h1 {
    font-size: 1.1rem;
    font-weight: 300;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .hero h2 {
    font-size: 1.9rem;
    font-weight: 900;
    color: var(--white);
    line-height: 1.2;
  }
  .hero h2 span { color: var(--gold); }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim));
  }
  .divider::after { background: linear-gradient(270deg, transparent, var(--gold-dim)); }
  .divider span { color: var(--gold); font-size: 0.7rem; letter-spacing: 0.2em; white-space: nowrap; }

  /* === TRIP CARD === */
  .trip-card {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
    position: relative;
  }
  .trip-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .trip-header {
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
  }
  .trip-icon {
    width: 44px; height: 44px;
    background: rgba(201,168,76,0.1);
    border: 1px solid var(--gold-dim);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .trip-title h3 { font-size: 1.1rem; font-weight: 800; }
  .trip-title p { font-size: 0.75rem; color: var(--gold); margin-top: 2px; font-weight: 400; }

  .trip-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 14px 20px;
    gap: 10px;
  }
  .stat { text-align: center; }
  .stat .val { font-size: 0.8rem; font-weight: 700; color: var(--gold-light); }
  .stat .key { font-size: 0.65rem; color: #666; margin-top: 2px; }

  /* === FORM === */
  .form-card {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .form-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .form-card h3 {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.08em;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 0.78rem;
    color: #888;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .form-group input, .form-group textarea {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    color: var(--white);
    transition: border-color 0.2s, background 0.2s;
    resize: none;
    text-align: right;
  }
  .form-group input:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--gold-dim);
    background: rgba(201,168,76,0.05);
  }
  .form-group input::placeholder, .form-group textarea::placeholder { color: #444; }

  /* Stars */
  .stars-group { margin-bottom: 18px; }
  .stars-group label {
    display: block;
    font-size: 0.78rem;
    color: #888;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .stars {
    display: flex;
    gap: 8px;
    flex-direction: row-reverse;
    justify-content: flex-end;
  }
  .stars input { display: none; }
  .stars label {
    font-size: 2rem;
    color: #333;
    cursor: pointer;
    transition: color 0.15s, transform 0.15s;
    margin: 0;
    line-height: 1;
  }
  .stars input:checked ~ label,
  .stars label:hover,
  .stars label:hover ~ label {
    color: var(--gold);
  }
  .stars label:hover { transform: scale(1.15); }

  /* Submit */
  .btn-submit {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    background-size: 200% 100%;
    color: var(--black);
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background-position 0.4s, transform 0.15s;
    letter-spacing: 0.05em;
  }
  .btn-submit:hover { background-position: right; }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* === SUCCESS === */
  .success-screen {
    display: none;
    text-align: center;
    padding: 50px 20px;
  }
  .success-screen.show { display: block; }
  .success-icon {
    width: 70px; height: 70px;
    background: rgba(201,168,76,0.1);
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    margin: 0 auto 20px;
  }
  .success-screen h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
  .success-screen p { font-size: 0.85rem; color: #888; line-height: 1.8; }
  .btn-again {
    margin-top: 24px;
    padding: 12px 28px;
    background: none;
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    color: var(--gold);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* === TOAST === */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%; transform: translateX(-50%);
    background: #c0392b;
    color: white;
    padding: 10px 22px;
    border-radius: 50px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* footer */
  .footer {
    text-align: center;
    padding-top: 10px;
    font-size: 0.7rem;
    color: #444;
    letter-spacing: 0.1em;
  }
  .footer span { color: var(--gold-dim); }
</style>
</head>
<body>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="logo-ring">
      <img src="https://raw.githubusercontent.com/OmarAlQ4/TM-Hiking-review/main/TM%20Logo%20.jpg" alt="TM Logo" />
    </div>
    <h1>رحلات التميّز</h1>
    <h2>قيّم <span>تجربتك</span></h2>
  </div>

  <!-- TRIP INFO -->
  <div class="trip-card">
    <div class="trip-header">
      <div class="trip-icon">⛰️</div>
      <div class="trip-title">
        <h3>جبل غيثان</h3>
        <p>السودة – عسير · ٢٤/٠٥/٢٠٢٦</p>
      </div>
    </div>
    <div class="trip-stats">
      <div class="stat">
        <div class="val">+٣٠٠٠م</div>
        <div class="key">الارتفاع</div>
      </div>
      <div class="stat">
        <div class="val">هايكنق</div>
        <div class="key">النوع</div>
      </div>
      <div class="stat">
        <div class="val">جبلية</div>
        <div class="key">الطبيعة</div>
      </div>
    </div>
  </div>

  <!-- FORM -->
  <div id="formSection">
    <div class="form-card">
      <h3>✦ بياناتك</h3>
      <div class="form-group">
        <label>الاسم</label>
        <input type="text" id="nameInput" placeholder="اكتب اسمك" />
      </div>
    </div>

    <div class="form-card">
      <h3>✦ تقييمك</h3>

      <div class="stars-group">
        <label>التقييم العام</label>
        <div class="stars">
          <input type="radio" name="rating" id="s5" value="5"><label for="s5">★</label>
          <input type="radio" name="rating" id="s4" value="4"><label for="s4">★</label>
          <input type="radio" name="rating" id="s3" value="3"><label for="s3">★</label>
          <input type="radio" name="rating" id="s2" value="2"><label for="s2">★</label>
          <input type="radio" name="rating" id="s1" value="1"><label for="s1">★</label>
        </div>
      </div>

      <div class="form-group">
        <label>تعليقك على الرحلة</label>
        <textarea id="commentInput" rows="4" placeholder="شاركنا تجربتك وانطباعك..."></textarea>
      </div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitReview()">
      إرسال التقييم ✦
    </button>
  </div>

  <!-- SUCCESS -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon">✓</div>
    <h2>شكراً لك! 🌟</h2>
    <p>وصل تقييمك بنجاح<br>رأيك يهمنا ويساعدنا نطور رحلاتنا</p>
    <button class="btn-again" onclick="resetForm()">تقييم آخر</button>
  </div>

  <div class="footer">
    <span>رحلات التميّز | TM</span> · جميع الحقوق محفوظة
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyDmvCzLtpAZlIvECeaHbCp2WLteZak07ZBe-2xmLz3cBL94rAOafcROIY42yg-Ae1p/exec';

async function submitReview() {
  const name = document.getElementById('nameInput').value.trim();
  const rating = document.querySelector('input[name="rating"]:checked')?.value;
  const comment = document.getElementById('commentInput').value.trim();

  if (!name) { showToast('الرجاء كتابة اسمك'); return; }
  if (!rating) { showToast('الرجاء اختيار تقييم بالنجوم'); return; }
  if (!comment) { showToast('الرجاء كتابة تعليق'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'جارٍ الإرسال...';

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, rating, comment, trip: 'جبل غيثان' })
    });

    document.getElementById('formSection').style.display = 'none';
    document.getElementById('successScreen').classList.add('show');

  } catch (err) {
    showToast('حدث خطأ، حاول مرة ثانية');
    btn.disabled = false;
    btn.textContent = 'إرسال التقييم ✦';
  }
}

function resetForm() {
  document.getElementById('nameInput').value = '';
  document.getElementById('commentInput').value = '';
  document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = false);
  document.getElementById('formSection').style.display = 'block';
  document.getElementById('successScreen').classList.remove('show');
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = 'إرسال التقييم ✦';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
